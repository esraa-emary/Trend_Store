<div class="d-flex align-items-center justify-content-between p-4 w-100">
    <h2 class="mb-0">Trend Store</h2>
    <ul class="navbar-nav flex-row gap-5 fs-5">
        <li class="nav-item">
            <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active fw-bold"
                [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" routerLink="/admin/products" routerLinkActive="active fw-bold"
                [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-box-seam"></i> Products
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" routerLink="/admin/orders" routerLinkActive="active fw-bold"
                [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-cart-check"></i> Orders
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active fw-bold"
                [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-people"></i> Users
            </a>
        </li>
    </ul>

    <button type="button" class="btn btn-outline-danger btn-m d-flex align-items-center gap-1" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i> Logout
    </button>
</div>
