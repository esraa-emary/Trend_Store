<div class="modal-backdrop" (click)="closed.emit()">
  <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="edit-title" (click)="$event.stopPropagation()">
    <div class="modal-heading">
      <h2 id="edit-title">Edit Product</h2>
      <button type="button" class="btn-close" aria-label="Close" (click)="closed.emit()"></button>
    </div>
    <app-product-form [product]="product()" [isPage]="false" [btnText]="'Update Product'" (productSubmit)="update($event)"></app-product-form>
  </section>
</div>
