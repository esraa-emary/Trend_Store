<div class="container py-5 checkout-container">
  <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <h2 class="fw-normal m-0 serif-heading">Checkout</h2>
    <a routerLink="/cart" class="text-dark text-decoration-none back-link">← Back to Cart</a>
  </div>

  <div class="bg-white p-4 border">
    <form (submit)="placeOrder($event)">
      <div class="mb-3">
        <label class="form-label text-uppercase text-secondary form-label-compact">Full Name</label>
        <input type="text" class="form-control rounded-0 border-dark bg-transparent py-2" placeholder="Samah Mohamed" required>
      </div>

      <div class="mb-3">
        <label class="form-label text-uppercase text-secondary form-label-compact">Shipping Address</label>
        <input type="text" class="form-control rounded-0 border-dark bg-transparent py-2" placeholder="Street, City, Country" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-uppercase text-secondary form-label-compact">Phone Number</label>
        <input type="text" class="form-control rounded-0 border-dark bg-transparent py-2" placeholder="+20..." required>
      </div>

      <div class="p-3 mb-4 bg-light border">
        <div class="d-flex justify-content-between mb-2">
          <span>Items Total:</span>
          <span>${{ cartService.totalPrice() }}</span>
        </div>
        <div class="d-flex justify-content-between fw-bold">
          <span>Final Amount:</span>
          <span>${{ cartService.totalPrice() }}</span>
        </div>
      </div>

      <button type="submit" class="btn btn-dark w-100 py-3 text-uppercase spaced-button">
        Complete Order
      </button>
    </form>
  </div>
</div>
