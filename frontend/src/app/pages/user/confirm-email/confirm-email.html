<div class="container py-5 mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="text-center mb-5">
        <h6 class="text-muted text-uppercase" style="letter-spacing: 2px; font-size: 0.75rem;">Atelier/Noir</h6>
        <h1 class="serif-font display-5">Confirm Email.</h1>
        <p class="text-muted small mt-2">Enter the OTP sent to your email address.</p>
      </div>

      @if (errorMessage()) {
        <div class="alert alert-danger rounded-0 mb-4" role="alert" style="font-size: 0.9rem;">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="alert alert-success rounded-0 mb-4" role="alert" style="font-size: 0.9rem;">
          {{ successMessage() }}
        </div>
      }

      <form (submit)="onConfirm(); $event.preventDefault()">
        <div class="mb-3">
          <label class="form-label text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;">Email Address</label>
          <input type="email" [(ngModel)]="email" name="email" class="form-control rounded-0 bg-transparent border-dark" required>
        </div>

        <div class="mb-4">
          <label class="form-label text-muted text-uppercase" style="font-size: 0.75rem; letter-spacing: 1px;">OTP Code</label>
          <input type="text" [(ngModel)]="confirmOTP" name="confirmOTP" class="form-control rounded-0 bg-transparent border-dark text-center fs-4 tracking-widest" placeholder="------" required>
        </div>

        <button type="submit" class="btn btn-dark w-100 rounded-0 py-2 text-uppercase mb-3" style="letter-spacing: 1px; font-size: 0.8rem;" [disabled]="isLoading()">
          @if (isLoading()) {
            <span>Verifying...</span>
          } @else {
            <span>Confirm Email</span>
          }
        </button>

        <div class="text-center">
          <a routerLink="/login" class="text-dark text-decoration-none border-bottom border-dark pb-1" style="font-size: 0.8rem; letter-spacing: 1px;">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>
</div>
