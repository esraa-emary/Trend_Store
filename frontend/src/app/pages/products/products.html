<div class="container my-5">
  <h2 class="text-center mb-4">Our Products</h2>

  <!-- Search Bar -->
  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Search products by title..." 
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <!-- Category Filter Buttons -->
  <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
    <button class="btn btn-outline-dark" [class.active]="selectedCategory === 'All'" (click)="filterByCategory('All')">All</button>
    <button class="btn btn-outline-dark" [class.active]="selectedCategory === 'Lips'" (click)="filterByCategory('Lips')">Lips</button>
    <button class="btn btn-outline-dark" [class.active]="selectedCategory === 'Face'" (click)="filterByCategory('Face')">Face</button>
    <button class="btn btn-outline-dark" [class.active]="selectedCategory === 'Eyes'" (click)="filterByCategory('Eyes')">Eyes</button>
  </div>

  <!-- Products Grid -->
  <div class="row g-4">
    @for (product of paginatedProducts; track product.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm border-0">
          <img [src]="product.image" class="card-img-top p-3 rounded" alt="product image" style="height: 220px; object-fit: contain;" />
          <div class="card-body d-flex flex-column">
            <span class="badge bg-light text-secondary w-auto align-self-start mb-2">{{ product.category }}</span>
            <h5 class="card-title fs-6 fw-bold">{{ product.title }}</h5>
            <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="fs-5 fw-bold text-dark">${{ product.price }}</span>
              <button class="btn btn-dark btn-sm px-3">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="text-center my-5">
        <p class="fs-5 text-muted">No products found!</p>
      </div>
    }
  </div>

  <!-- Pagination Controls -->
  @if (totalPages > 1) {
    <div class="d-flex justify-content-center align-items-center gap-2 mt-5">
      <button class="btn btn-outline-dark btn-sm" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">Previous</button>
      
      <span class="fw-bold px-2">Page {{ currentPage }} of {{ totalPages }}</span>

      <button class="btn btn-outline-dark btn-sm" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">Next</button>
    </div>
  }
</div>
